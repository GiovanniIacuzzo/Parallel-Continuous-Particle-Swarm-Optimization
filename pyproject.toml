[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpso-parallel"
version = "0.6.0"
description = "Continuous PSO engine with synchronous, asynchronous, and island parallel architectures"
requires-python = ">=3.10"
authors = [{name = "CPSO research project"}]
# License metadata is intentionally omitted until the rights holder confirms
# the intended license and a matching LICENSE file is added.

[project.optional-dependencies]
analysis = ["numpy>=1.23", "matplotlib>=3.7", "scipy>=1.10", "psutil>=5.9"]
test = ["pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
