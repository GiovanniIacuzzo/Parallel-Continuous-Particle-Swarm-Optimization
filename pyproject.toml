[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpso-serial"
version = "0.3.0"
description = "Serial reference and synchronous master-slave CPSO performance engine"
requires-python = ">=3.10"
authors = [{name = "CPSO research project"}]
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
