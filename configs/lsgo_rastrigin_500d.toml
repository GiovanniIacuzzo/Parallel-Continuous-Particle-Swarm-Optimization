# Baseline configuration for reproducible, fixed-global-population experiments.
# With population_size=100 and iterations=4999, the nominal budget is exactly 500000 FEs.
[problem]
name = "rastrigin"
dimension = 500
lower_bound = -5.12
upper_bound = 5.12
optimum_position = 0.0

[algorithm]
population_size = 100
iterations = 4999
workers = 1
topology = "star"
sync_interval = 1
seed = 20261104

[cpso]
mu_max = 0.9
mu_min = 0.4
cognitive = 2.05
social = 2.05
dt = 1.0
initial_velocity_fraction = 0.1
boundary_restitution = 0.5
